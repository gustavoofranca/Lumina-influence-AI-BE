name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov

      - name: Lint (ruff)
        run: ruff check src tests || true  # não bloqueia o build nesta fase do TCC

      - name: Run tests with coverage
        # Os testes usam SQLite in-memory (TestConfig) — não precisam de Postgres.
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=60
