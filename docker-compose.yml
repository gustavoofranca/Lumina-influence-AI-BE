# Nome fixo do projeto: mantém esta stack única, seja qual for o diretório
# de onde o `docker compose` é chamado.
name: lumina

# Ambiente de desenvolvimento do back-end: PostgreSQL + API Flask.
# Uso: docker compose up -d  →  API em http://localhost:5000/api/v1
services:
  db:
    image: postgres:17-alpine
    container_name: lumina-postgres
    environment:
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina
      POSTGRES_DB: lumina_dev
    ports:
      - "5432:5432"
    volumes:
      - lumina_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d lumina_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: lumina-backend
    env_file: .env
    environment:
      # Na rede do compose o Postgres atende no host `db`, não em localhost.
      # Precedência do compose: `environment` sobrescreve o `.env` acima.
      # DATABASE_URL: postgresql://lumina:lumina@db:5432/lumina_dev
      FLASK_ENV: dev
      FLASK_DEBUG: 1
    ports:
      - "5000:5000"
    volumes:
      # Bind mount para hot-reload: o reloader do Flask enxerga as edições no host.
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  lumina_pgdata:
